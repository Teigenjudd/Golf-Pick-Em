<!doctype html>
<!--
  Source art for the link-preview image (public/og-default.png).

  Rendered to PNG by scripts/og/build-og.mjs via headless Chrome, which is why this is
  HTML and not SVG: Chrome loads the real Barlow Condensed / Inter webfonts, so the card
  is set in the actual brand faces. Crawlers won't render SVG, and iMessage needs a PNG.

  This card is the app's front door — every sport's invite unfurls through it (per-sport
  images are backlogged, docs/BACKLOG.md H5) — so it's styled off the neutral general
  register (sand background, brand-rust wordmark, same tokens as Login/Dashboard), not
  golf's fairway/gold pool-detail look. The two shields on the right are one badge per
  sport Poold actually runs today — Golf's SportBadge default (src/components/
  SportBadge.jsx DEFAULT_BADGE) and CFB's (src/theme/cfb.js CFB_BADGE) — not a specific
  tournament's badge, so the card doesn't imply "golf majors only."

  Edit this file, re-run `npm run og`, commit the PNG.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        padding: 0 96px;
        background: #F8F0E4; /* sand — the general/dashboard register's page background */
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      .wordmark {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: .07em;
        line-height: .9;
        color: #C14A18; /* brand rust — same as the Login/Dashboard wordmark */
      }

      .tagline {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-style: italic;
        font-size: 40px;
        color: #9E9488; /* warm-400, matching Login's tagline */
        letter-spacing: .01em;
      }

      .promise {
        font-size: 26px;
        font-weight: 500;
        color: #4A4440; /* warm-600 */
        letter-spacing: .01em;
      }

      .badges {
        position: absolute;
        right: 96px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 18px;
      }

      /* the shield, at og scale — same geometry as SportBadge */
      .badge {
        width: 104px;
        height: 120px;
        border-radius: 26px 26px 52px 52px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }

      .badge .l1 {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 800;
        font-size: 38px;
        line-height: .82;
        letter-spacing: .02em;
        color: #F8F5EE;
      }

      .badge .l2 {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .06em;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="wordmark">POOLD</div>
      <div class="tagline">Make it interesting.</div>
    </div>

    <div class="promise">No app. No password. No download.</div>

    <!-- one badge per sport Poold runs, not a specific tournament's -->
    <div class="badges">
      <div class="badge" style="background:#1F6F47; border:5px solid #E6C66B">
        <span class="l1">GO</span>
        <span class="l2" style="color:#E6C66B">GOLF</span>
      </div>
      <div class="badge" style="background:#101C3D; border:5px solid #D6291B">
        <span class="l1">CFB</span>
        <span class="l2" style="color:#D6291B">26</span>
      </div>
    </div>
  </body>
</html>
